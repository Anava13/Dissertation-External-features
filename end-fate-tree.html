  .n-death .n-box { fill:var(--red-soft); stroke:#E3B6AE; }
  .container .n-box { fill:none; stroke:#B9CFD2; stroke-dasharray:5 4; }
  .group .n-box { fill:none; stroke:#CDD3C9; stroke-dasharray:2 6; }
  .g-label { font-size:11px; fill:#9AA39C; letter-spacing:.08em; text-transform:uppercase; }
  .frame .n-box { stroke:#C7CEC6; stroke-dasharray:9 5; }
  .edge { stroke:#B6BDB2; stroke-width:1.25; fill:none; }

  svg.traced .node.group { opacity:.3; }

  svg.traced .node.group.on .n-box { stroke:var(--moss); stroke-width:1.25; stroke-dasharray:2 6; }

function svgTree(g) {
  const nodeOn = g ? new Set(g.nodes) : null;
  const edgeMap = g ? g.edges : null;
  const wMap = (g && g.weights) || {};
  let s = '<svg viewBox="0 0 780 1700" role="img" class="' + (g ? 'traced' : '') + '">';
  s += '<title>Decision tree for chromosome end fate</title>';
  s += '<desc>Questions on tract maintenance, cap occupancy, Exo1, resection depth, checkpoint signalling, restoration after arrest, and the terminal NHEJ reaction, ending in proliferation, gene loss or fusion.</desc>';
  s += '<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">';
  s += '<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>';

  NODES.filter(function (n) { return n.k === 'group'; }).forEach(function (c) {
    const lit = nodeOn && c.mem.some(function (m) { return nodeOn.has(m); });
    s += '<g class="node group' + (lit ? ' on' : '') + '">';
    s += '<rect class="n-box" x="' + c.x + '" y="' + c.y + '" width="' + c.w + '" height="' + c.h + '" rx="14"/>';
    s += '<text class="g-label" x="' + c.lxx + '" y="' + c.lyy + '" dominant-baseline="central">' + c.label + '</text></g>';
  });

  NODES.filter(function (n) { return n.k === 'container'; }).forEach(function (c) {
    s += '<g class="node container' + (c.frame ? ' frame' : '') + (nodeOn && nodeOn.has(c.id) ? ' on' : '') + '">';
    s += '<rect class="n-box" x="' + c.x + '" y="' + c.y + '" width="' + c.w + '" height="' + c.h + '" rx="16"/>';
    s += '<text class="n-title" x="' + c.lxx + '" y="' + c.lyy + '" dominant-baseline="central">' + c.label + '</text></g>';
  });

  EDGES.forEach(function (e) {
    const active = edgeMap && Object.prototype.hasOwnProperty.call(edgeMap, e.id);
    const w = active && wMap[e.id] ? ' w-' + wMap[e.id] : '';
    s += '<g class="edgegroup' + (active ? ' on' : '') + w + '">';
    s += '<path class="edge" d="' + e.d + '" marker-end="url(#ar)"/>';
    if (e.l) {
      s += '<text class="e-label" x="' + e.lx + '" y="' + e.ly + '" text-anchor="' + (e.la === 'start' ? 'start' : 'middle') + '" dominant-baseline="central">' + e.l + '</text>';
    }
    if (active && edgeMap[e.id]) {
      s += '<text class="e-allele" x="' + (e.ax !== undefined ? e.ax : e.lx) + '" y="' + (e.ay !== undefined ? e.ay : e.ly + 15) + '" text-anchor="' + (e.aa || 'middle') + '" dominant-baseline="central">' + edgeMap[e.id] + '</text>';
    }
    s += '</g>';
  });

  NODES.filter(function (n) { return n.k !== 'container' && n.k !== 'group'; }).forEach(function (n) {
    const cx = n.x + n.w / 2;
    const cy = n.h > 100 ? n.y + 44 : n.y;
    s += '<g class="node n-' + n.k + (nodeOn && nodeOn.has(n.id) ? ' on' : '') + '">';
    s += '<rect class="n-box" x="' + n.x + '" y="' + n.y + '" width="' + n.w + '" height="' + n.h + '" rx="7"/>';
    s += '<text class="n-title" x="' + cx + '" y="' + (cy + 22) + '" text-anchor="middle" dominant-baseline="central">' + n.t + '</text>';
    s += '<text class="n-sub" x="' + cx + '" y="' + (cy + 43) + '" text-anchor="middle" dominant-baseline="central">' + n.s + '</text>';
    s += '</g>';
  });
  return s + '</svg>';
}

function renderIntro() {
  return '<div class="slide solo"><div><div class="intro">' +
    '<p>The dashed box on the right holds every place a chromosome end can finish. Proliferating and death each carry a box of their own, because the routes into them differ. Proliferation splits by how length is being held and whether a lesion is still present; death splits by whether the cell divided again before it died.</p>' +
    '<p>The questions are grouped by what they are about: length maintenance, resection, checkpoint activation, arrest resolution, and end joining. A group lights when a trace touches any question inside it. The cap question sits outside every group, because every page either stops there or passes through it.</p>' +
    '<p>Arrest is a pause, not a fate. The question after it has three exits: Rad52 recombination, adaptation into division with the end still uncapped, and neither. Reversing a <em>cdc13-1</em> lesion takes a shift back to permissive temperature, so it is not a branch here. Each page names one fixed condition and no page moves the temperature.</p>' +
    '<p>Temperature-sensitive alleles get one page per temperature, and permissivity is named against the allele it applies to. A page with no conditional allele carries no temperature, which is deliberate rather than missing.</p>' +
    '<p>Each page is a prediction. Steps below the measurement marker run past what the cited experiment reports, and the verdict on those pages is marked as predicted. The falsifier line names what would break the page.</p>' +
    '<p>On the genotype slides a thick arrow is the common outcome and a dashed arrow is the rarer one. Alleles that force a branch sit beside it in red.</p>' +
    '</div><div class="figure">' + svgTree(null) + '</div></div></div>';
}

function renderGenotype(g) {
  let steps = '<ol class="trace">';
  const obs = (g.observed === undefined) ? g.steps.length : g.observed;
  g.steps.forEach(function (st, idx) {
    const c = [];
    if (g.skipped !== undefined && idx === g.skipped) { c.push('skipped'); }
    if (idx >= obs) { c.push('inferred'); }
    const cls = c.length ? ' class="' + c.join(' ') + '"' : '';
    steps += '<li' + cls + '><div class="q">' + st[0] + '</div><div class="a">' + st[1] + '</div></li>';
    if (idx === obs - 1 && obs < g.steps.length) {
      steps += '<li class="mark">measurement stops here</li>';
    }
  });
  steps += '</ol>';

  let v = '';
  const pred = obs < g.steps.length;
  g.out.forEach(function (o, idx) {
    v += '<div class="verdict ' + o.tone + (idx > 0 ? ' secondary' : '') + (pred ? ' predicted' : '') + '">';
    if (o.rank) v += '<div class="rank">' + o.rank + '</div>';
    v += '<div class="label">' + o.label + '</div>';
    if (o.setpoint) v += '<div class="setpoint">' + o.setpoint + '</div>';
    if (pred) v += '<div class="basis">predicted, past the reported endpoint</div>';
    v += '</div>';
  });
  v += '<div class="reported">Reported: <span>' + g.reported + '</span></div>';
  if (g.cite) {
    v += '<div class="cite' + (g.cite === X ? ' missing' : '') + '">Citation: <span>' + g.cite + '</span></div>';
  }
  if (g.caveat) v += '<div class="caveat">' + g.caveat + '</div>';
  if (g.test) v += '<div class="test"><b>Would falsify:</b> ' + g.test + '</div>';

  return '<div class="slide"><div class="figure">' + svgTree(g) + '</div>' +
    '<div class="panel"><h2 class="genotype">' + g.name +
    (g.temp ? '<span class="temp">' + g.temp + '</span>' : '') +
    (g.cond ? '<div class="cond">' + g.cond + '</div>' : '') + '</h2>' +
    steps + v + '</div></div>';
}

let i = 0;
const total = G.length + 1;
const stage = document.getElementById('stage');
const count = document.getElementById('count');
const prev = document.getElementById('prev');
const next = document.getElementById('next');

function draw() {
  stage.innerHTML = i === 0 ? renderIntro() : renderGenotype(G[i - 1]);
  count.textContent = (i + 1) + ' of ' + total;
  prev.disabled = i === 0;
  next.disabled = i === total - 1;
  window.scrollTo({ top: 0 });
}
function go(d) { i = Math.min(total - 1, Math.max(0, i + d)); draw(); }
prev.addEventListener('click', function () { go(-1); });
next.addEventListener('click', function () { go(1); });
document.addEventListener('keydown', function (e) {
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { go(1); }
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') { go(-1); }
});
draw();
</script>
