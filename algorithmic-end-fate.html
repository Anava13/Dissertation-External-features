<!DOCTYPE html>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Algorithmic Chromosome End Fate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root {
    --paper:#F6F7F4; --card:#FFFFFF; --ink:#17201D; --slate:#6E7671;
    --rule:#D8DCD4; --moss:#3E6B57; --red:#A62B1C; --red-soft:#F7E8E5;
    --amber:#8A6412; --amber-soft:#F6EEDC; --teal-soft:#E4EEEF; --teal:#2F6068;
    --violet:#5B4A7A; --violet-soft:#ECE8F2;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; padding:0; background:var(--paper); color:var(--ink);
    font-family:Inter, system-ui, sans-serif; font-size:16px; line-height:1.6; }
  .wrap { max-width:1580px; margin:0 auto; padding:24px 28px 64px; }
  header.bar { display:flex; align-items:baseline; gap:20px; border-bottom:1px solid var(--rule);
    padding-bottom:14px; margin-bottom:24px; flex-wrap:wrap; }
  header.bar h1 { font-family:Newsreader, Georgia, serif; font-weight:500; font-size:20px; margin:0; }
  header.bar .sig { font-family:Newsreader, Georgia, serif; font-style:italic; font-size:17px; color:var(--red); }
  .count { color:var(--slate); font-size:14px; margin-left:auto; font-variant-numeric:tabular-nums; }

  .layout { display:grid; grid-template-columns:264px minmax(300px,1fr) minmax(320px,410px); gap:32px; align-items:start; }

  /* ---- control column ---- */
  .controls { position:sticky; top:16px; max-height:calc(100vh - 40px); overflow-y:auto;
    padding-right:8px; }
  .cgroup { margin-bottom:18px; }
  .cgroup h3 { font-family:Inter, sans-serif; font-size:12px; font-weight:500; color:var(--slate);
    margin:0 0 8px; padding-bottom:4px; border-bottom:1px solid var(--rule); }
  .gene { display:flex; align-items:center; gap:8px; margin-bottom:5px; }
  .gene label { font-family:Newsreader, Georgia, serif; font-style:italic; font-size:15px;
    width:74px; flex:none; color:var(--ink); }
  .gene select { flex:1; min-width:0; font:inherit; font-size:13px; padding:3px 6px; background:var(--card);
    color:var(--ink); border:1px solid var(--rule); border-radius:5px; font-family:Newsreader, Georgia, serif;
    font-style:italic; }
  .gene.set select { border-color:var(--red); color:var(--red); }
  .gene select:focus-visible { outline:2px solid var(--moss); outline-offset:1px; }

  .tempbox { background:var(--card); border:1px solid var(--rule); border-radius:8px; padding:12px 14px; margin-bottom:18px; }
  .tempbox .row { display:flex; align-items:baseline; justify-content:space-between; }
  .tempbox .val { font-family:Newsreader, Georgia, serif; font-size:22px; font-weight:500; }
  .tempbox input[type=range] { width:100%; margin:8px 0 2px; accent-color:var(--moss); }
  .tempbox .regimes { font-size:12px; color:var(--slate); line-height:1.45; }
  .tempbox .regimes b { color:var(--amber); font-weight:500; }
  .tempbox.inert .val { color:var(--slate); }

  .presetbox { margin-bottom:18px; }
  .presetbox select { width:100%; font:inherit; font-size:13px; padding:5px 7px; background:var(--card);
    border:1px solid var(--rule); border-radius:6px; color:var(--ink); }
  button.reset { font:inherit; font-size:13px; padding:5px 12px; background:var(--card); color:var(--slate);
    border:1px solid var(--rule); border-radius:6px; cursor:pointer; width:100%; margin-top:8px; }
  button.reset:hover { border-color:var(--moss); color:var(--moss); }

  /* ---- figure ---- */
  .figure { display:flex; justify-content:center; }
  .figure svg { width:100%; max-width:680px; height:auto; }

  /* ---- panel ---- */
  ol.trace { list-style:none; margin:0 0 20px; padding:0; }
  ol.trace li { border-left:2px solid var(--moss); padding:0 0 14px 16px; }
  ol.trace li:last-child { padding-bottom:0; }
  ol.trace li.predicted { border-left-color:#C3CABF; border-left-style:dotted; }
  ol.trace li.predicted .a { color:var(--slate); }
  ol.trace li.mark { border-left:none; padding:0 0 14px 18px; font-size:12px;
    letter-spacing:.06em; color:var(--amber); }
  .q { font-size:14px; color:var(--slate); }
  .a { font-size:15px; }
  .a em { font-style:italic; color:var(--red); font-family:Newsreader, Georgia, serif; font-size:16px; }
  .drv { font-size:12.5px; color:var(--slate); margin-top:3px; padding-left:10px; border-left:1px solid var(--rule); }
  .drv i { font-family:Newsreader, Georgia, serif; color:var(--red); font-size:13.5px; }
  .drv .src { color:var(--ink); }
  .drv .src.none { color:var(--red); }

  .verdict { border:1px solid var(--rule); border-radius:10px; padding:14px 18px; background:var(--card); margin-bottom:10px; }
  .verdict.secondary { border-style:dashed; }
  .verdict.predicted { border-style:dotted; }
  .verdict .rank { font-size:12px; color:var(--slate); margin-bottom:2px; }
  .verdict .label { font-family:Newsreader, Georgia, serif; font-size:21px; font-weight:500; }
  .verdict .setpoint { font-size:14px; color:var(--slate); }
  .verdict .basis { font-size:12px; color:var(--slate); margin-top:4px; }
  .verdict.death .label { color:var(--red); }
  .verdict.live .label { color:var(--teal); }

  .box { border:1px solid var(--rule); border-radius:10px; background:var(--card); padding:14px 18px; margin-top:14px; }
  .box h4 { margin:0 0 8px; font-family:Inter, sans-serif; font-size:12px; font-weight:500; color:var(--slate); }
  .box.evidence { border-left:3px solid var(--teal); }
  .box.contested { border-left:3px solid var(--amber); background:var(--amber-soft); border-color:#E7D9B6; }
  .box.silent { border-left:3px solid var(--violet); }
  .reported { font-size:14px; color:var(--slate); }
  .reported span { color:var(--ink); }
  .cite { font-size:13px; color:var(--slate); margin-top:6px; }
  .cite span { color:var(--ink); }
  .cite.missing span { color:var(--red); }
  .caveat { margin-top:12px; font-size:14px; color:var(--slate); border-left:2px solid var(--amber); padding-left:12px; }
  .test { margin-top:12px; font-size:14px; color:var(--slate); border-left:2px solid var(--teal); padding-left:12px; }
  .test b { color:var(--teal); font-weight:500; }
  .box.contested p, .box.silent p { margin:0 0 8px; font-size:13.5px; color:var(--slate); }
  .box.contested p:last-child, .box.silent p:last-child { margin-bottom:0; }
  .box.contested b, .box.silent b { color:var(--ink); font-weight:500; }
  .box.silent i, .box.contested i { font-family:Newsreader, Georgia, serif; color:var(--red); font-size:14.5px; }

  .nodata { font-size:13.5px; color:var(--slate); margin-top:14px; padding-top:10px; border-top:1px solid var(--rule); }

  /* ---- tree styling (inherited) ---- */
  text { font-family:Inter, system-ui, sans-serif; }
  .n-title { font-size:13px; font-weight:500; fill:var(--ink); }
  .n-sub { font-size:11.5px; fill:var(--slate); }
  .e-label { font-size:11.5px; fill:var(--slate); }
  .e-allele { font-size:12px; font-family:Newsreader, Georgia, serif; font-style:italic; fill:var(--red); }
  .n-box { fill:var(--card); stroke:#C3CABF; stroke-width:1; }
  .n-state .n-box { fill:#EEF1EC; }
  .n-live .n-box { fill:var(--teal-soft); stroke:#B9CFD2; }
  .n-hold .n-box { fill:var(--amber-soft); stroke:#DEC894; }
  .n-death .n-box { fill:var(--red-soft); stroke:#E3B6AE; }
  .container .n-box { fill:none; stroke:#B9CFD2; stroke-dasharray:5 4; }
  .group .n-box { fill:none; stroke:#CDD3C9; stroke-dasharray:2 6; }
  .g-label { font-size:11px; fill:#9AA39C; letter-spacing:.08em; }
  .frame .n-box { stroke:#C7CEC6; stroke-dasharray:9 5; }
  .edge { stroke:#B6BDB2; stroke-width:1.25; fill:none; }

  svg.traced .node, svg.traced .edgegroup { opacity:.16; }
  svg.traced .node.on, svg.traced .edgegroup.on { opacity:1; }
  svg.traced .node.on .n-box { stroke:var(--moss); stroke-width:2; }
  svg.traced .node.on.n-live .n-box { stroke:var(--teal); }
  svg.traced .node.on.n-hold .n-box { stroke:var(--amber); }
  svg.traced .node.on.n-death .n-box { stroke:var(--red); }
  svg.traced .node.on.container .n-box { stroke:var(--teal); stroke-width:1.25; }
  svg.traced .edgegroup.on .edge { stroke:var(--moss); stroke-width:2.25; }
  svg.traced .edgegroup.on.w-primary .edge { stroke-width:4; }
  svg.traced .edgegroup.on.w-secondary .edge { stroke-width:1.5; stroke-dasharray:6 4; }
  svg.traced .edgegroup.on .e-label { fill:var(--moss); font-weight:500; }
  svg.traced .node.frame { opacity:.42; }
  svg.traced .node.group { opacity:.3; }
  svg.traced .node.group.on { opacity:1; }
  svg.traced .node.group.on .n-box { stroke:var(--moss); stroke-width:1.25; stroke-dasharray:2 6; }
  svg.traced .node.group.on .g-label { fill:var(--moss); }

  @media (max-width:1200px) {
    .layout { grid-template-columns:240px 1fr; }
    .panel { grid-column:1 / -1; }
  }
  @media (max-width:820px) {
    .layout { grid-template-columns:1fr; }
    .controls { position:static; max-height:none; }
    .wrap { padding:20px 18px 48px; }
  }
</style>

/* ==========================================================================
   BASE CONTROLLER 1: build the control column
   ========================================================================== */

function buildInterface() {
  const host = document.getElementById('controls');

  host.innerHTML = composePresetMarkup() + composeTemperatureMarkup() + composeGeneMarkup();
  wireControlEvents(host);

  function composePresetMarkup() {
    // VIEW: preset chooser and reset (TERMINAL)
    let s = '<div class="presetbox"><select id="preset"><option value="">Load a genotype from the deck</option>';
    PRESETS.forEach(function (p, idx) {
      s += '<option value="' + idx + '">' + p.name + '</option>';
    });
    s += '</select><button class="reset" id="reset">Clear to wild type</button></div>';
    return s;
  }

  function composeTemperatureMarkup() {
    // VIEW: temperature slider shell, filled by refreshTemperatureReadout (TERMINAL)
    return '<div class="tempbox" id="tempbox">' +
      '<div class="row"><span style="font-size:13px;color:var(--slate)">Temperature</span>' +
      '<span class="val" id="tempval">23 °C</span></div>' +
      '<input type="range" id="temp" min="20" max="38" step="1" value="23" ' +
      'aria-label="Growth temperature in degrees Celsius">' +
      '<div class="regimes" id="regimes"></div></div>';
  }

  function composeGeneMarkup() {
    // VIEW: one labelled dropdown per gene, grouped by where it acts (TERMINAL)
    let s = '';
    GENE_GROUPS.forEach(function (grp) {
      s += '<div class="cgroup"><h3>' + grp.title + '</h3>';
      grp.genes.forEach(function (gene) {
        s += '<div class="gene" data-gene="' + gene + '"><label for="sel-' + gene + '">' + gene + '</label>' +
          '<select id="sel-' + gene + '" data-gene="' + gene + '">';
        GENES[gene].forEach(function (allele) {
          s += '<option value="' + allele + '">' + allele + '</option>';
        });
        s += '</select></div>';
      });
      s += '</div>';
    });
    return s;
  }

  function wireControlEvents(host) {
    // CONTROLLER: attach handlers, then draw once
    host.querySelectorAll('select[data-gene]').forEach(function (sel) {
      sel.addEventListener('change', function () {
        SELECTION[sel.dataset.gene] = sel.value;
        refreshPrediction();
      });
    });
    host.querySelector('#temp').addEventListener('input', function (e) {
      TEMP = Number(e.target.value);
      refreshPrediction();
    });
    host.querySelector('#preset').addEventListener('change', function (e) {
      if (e.target.value === '') { return; }
      applyPreset(PRESETS[Number(e.target.value)]);
    });
    host.querySelector('#reset').addEventListener('click', function () {
      Object.keys(GENES).forEach(function (g) { SELECTION[g] = GENES[g][0]; });
      syncControlsToSelection();
      refreshPrediction();
    });
    refreshPrediction();
  }
}

   ========================================================================== */

function applyPreset(preset) {
  Object.keys(GENES).forEach(function (g) { SELECTION[g] = GENES[g][0]; });
  Object.keys(preset.set).forEach(function (g) { SELECTION[g] = preset.set[g]; });
  TEMP = preset.temp;
  syncControlsToSelection();
  refreshPrediction();
}

/* ==========================================================================
   BASE CONTROLLER 3: resolve, traverse, render
   ========================================================================== */

function refreshPrediction() {
  const genotype = readGenotype();
  const state = resolveState(genotype, TEMP);
  const trace = traverseTree(state);
  const record = matchScholarship(genotype, TEMP);

  renderFigure(trace);
  renderPanel(genotype, state, trace, record);
  renderHeader(genotype, state, trace);
  refreshTemperatureReadout(genotype, state);
}

/* ==========================================================================
   SHARED: read the dropdowns
   ========================================================================== */

function readGenotype() {
  // MODEL: the non-wild-type alleles currently selected (TERMINAL)
  const alleles = [];
  const byGene = {};
  Object.keys(GENES).forEach(function (gene) {
    const chosen = SELECTION[gene];
    byGene[gene] = chosen;
    if (chosen !== GENES[gene][0]) { alleles.push(chosen); }
  });
  return { alleles:alleles, byGene:byGene, present:function (gene) { return byGene[gene] === GENES[gene][0]; } };
}

function syncControlsToSelection() {
  // VIEW: push SELECTION and TEMP back into the widgets (TERMINAL)
  Object.keys(GENES).forEach(function (gene) {
    const sel = document.getElementById('sel-' + gene);
    if (sel) { sel.value = SELECTION[gene]; }
  });
  const t = document.getElementById('temp');
  if (t) { t.value = String(TEMP); }
}

/* ==========================================================================
   SHARED: state resolution (phase one)
   Every variable is resolved before the tree is walked, so an answer low in
   the tree can depend on an allele that also acts high in it.
   ========================================================================== */

function resolveState(genotype, temp) {
  const state = {
    temp:temp, genotype:genotype,
    arbitration:[], contested:[], consumed:{}, effectsByAllele:{}
  };

  const effects = collectActiveEffects(genotype, temp, state);

  resolveTract(effects, state);
  resolveCap(effects, state);
  resolveNucleases(effects, state);
  resolveDepth(state);
  resolveAmplification(state);
  resolveSsdna(effects, state);
  resolveGeneRequirements(genotype, state);
  resolveExits(effects, genotype, state);

  return state;

  // === SUB-CONTROLLERS ===

  function collectActiveEffects(genotype, temp, state) {
    // MODEL: expand each selected allele into the effects live at this temperature (TERMINAL)
    const live = [];
    genotype.alleles.forEach(function (allele) {
      const entry = ALLELES[allele];
      if (!entry) { return; }
      state.effectsByAllele[allele] = [];
      entry.effects.forEach(function (eff) {
        const lo = (eff.tMin === undefined) ? -99 : eff.tMin;
        const hi = (eff.tMax === undefined) ? 99 : eff.tMax;
        if (temp < lo || temp >= hi) { return; }
        const inst = Object.assign({}, eff, { allele:allele });
        state.effectsByAllele[allele].push(inst);
        live.push(inst);
      });
    });
    return live;
  }

  function resolveTract(effects, state) {
    // SUB-CONTROLLER: pick one tract state from competing alleles
    const claims = effects.filter(function (e) { return e.kind === 'tract'; });
    state.tract = 'full';
    state.tractDrivers = [];
    if (!claims.length) { return; }

    let best = 'full';
    claims.forEach(function (c) {
      if (RULES.tractRank[c.value] > RULES.tractRank[best]) { best = c.value; }
    });
    state.tract = best;
    state.tractDrivers = claims.filter(function (c) { return c.value === best; });

    const losers = claims.filter(function (c) { return c.value !== best; });
    if (losers.length) {
      state.arbitration.push({
        node:'q1', rule:'eroding outranks short, short outranks full',
        won:state.tractDrivers.map(nameOf).join(', '), lost:losers.map(nameOf).join(', ') });
    }
  }

  function resolveCap(effects, state) {
    // SUB-CONTROLLER: cap occupancy, lesion identity and severity
    const capEffects = effects.filter(function (e) { return e.kind === 'cap'; });
    state.capFailures = capEffects;
    state.cstSeverity = 'none';
    state.kuLost = false;
    state.rap1Lost = (state.tract === 'eroding');

    capEffects.forEach(function (e) {
      if (e.target === 'cst') {
        if (e.severity === 'full' || state.cstSeverity === 'none') { state.cstSeverity = e.severity; }
        if (e.severity === 'full') { state.cstSeverity = 'full'; }
      }
      if (e.target === 'ku') { state.kuLost = true; }
    });

    state.lesion = pickLesion(state);
    state.capDrivers = capEffects.filter(function (e) {
      return (state.lesion === 'cst' && e.target === 'cst') || (state.lesion === 'ku' && e.target === 'ku');
    });
    if (state.lesion === 'cst' && state.kuLost) {
      state.arbitration.push({
        node:'q7', rule:'the deeper lesion sets the amplification answer',
        won:'CST failure', lost:'Ku loss', note:CONTESTED_NOTES.amplification });
      state.contested.push(CONTESTED_NOTES.amplification);
    }

    function pickLesion(state) {
      // MODEL: one lesion identity, by declared precedence (TERMINAL)
      if (state.cstSeverity !== 'none') { return 'cst'; }
      if (state.kuLost) { return 'ku'; }
      if (state.rap1Lost) { return 'erosion'; }
      return 'none';
    }
  }

  function resolveNucleases(effects, state) {
    // SUB-CONTROLLER: which long-range pathways survive at this end
    const available = RULES.nucleasesByLesion[state.lesion].slice();
    const removals = effects.filter(function (e) { return e.kind === 'nuclease'; });
    const removed = [];
    removals.forEach(function (e) {
      const at = available.indexOf(e.target);
      if (at >= 0) { available.splice(at, 1); removed.push(e); }
    });
    state.nucleases = available;
    state.nucleasesRemoved = removed;
    state.nucleaseStatus = available.length === 0 ? 'none'
      : (removed.length ? 'partial' : 'full');
  }

  function resolveDepth(state) {
    // MODEL: CST loss is the dominant term for depth (TERMINAL)
    if (state.lesion === 'none' || state.nucleases.length === 0) { state.depth = 'none'; return; }
    state.depth = (state.cstSeverity === 'full') ? 'kilobase' : 'intermediate';
  }

  function resolveAmplification(state) {
    // MODEL: only a CST protein failure amplifies through the clamp (TERMINAL)
    state.amplified = (state.lesion === 'cst');
  }

  function resolveSsdna(effects, state) {
    // SUB-CONTROLLER: ordinal ssDNA level, thresholded at q5
    let level = RULES.ssdnaBase[state.depth] + RULES.ssdnaLesion[state.lesion];
    const terms = [{ label:state.depth + ' depth at ' + lesionPhrase(state.lesion), value:level }];

    effects.filter(function (e) { return e.kind === 'ssdna'; }).forEach(function (e) {
      if (!predicateHolds(e.when, state)) { return; }
      level += e.delta;
      terms.push({ label:e.allele, value:e.delta, effect:e });
    });

    state.ssdna = level;
    state.ssdnaTerms = terms;
    state.ssdnaSignals = level >= RULES.ssdnaThreshold;
    state.ssdnaDrivers = terms.filter(function (t) { return t.effect; }).map(function (t) { return t.effect; });

    function predicateHolds(when, state) {
      // MODEL: evaluate an effect's gate against the state built so far (TERMINAL)
      if (!when) { return true; }
      if (when === 'amplified') { return state.amplified; }
      if (when === 'nuclease:partial') { return state.nucleaseStatus === 'partial'; }
      if (when.indexOf('lesion:') === 0) { return state.lesion === when.slice(7); }
      return true;
    }
  }

  function resolveGeneRequirements(genotype, state) {
    // SUB-CONTROLLER: the four all-or-nothing requirement sets
    state.cascade = evaluateSet(RULES.cascadeRequires, 'cascade');
    state.clampLoaded = evaluateSet(RULES.clampRequires, 'clampLoaded');
    state.repressors = evaluateSet(RULES.repressionRequires, 'repressors');
    state.machinery = evaluateSet(RULES.machineryRequires, 'machinery');

    if (!state.cascade.intact) {
      const effectorOnly = state.cascade.missing.every(function (m) { return m.contested; });
      if (effectorOnly) { state.contested.push(CONTESTED_NOTES.cascadeEffector); }
    }

    function evaluateSet(spec, label) {
      // MODEL: which named members of a requirement set are absent (TERMINAL)
      const missing = [];
      spec.forEach(function (req) {
        if (!genotype.present(req.gene)) {
          missing.push({ name:req.name, allele:genotype.byGene[req.gene], contested:!!req.contested, inferred:!!req.inferred });
        }
      });
      return { intact:missing.length === 0, missing:missing, label:label };
    }
  }

  function resolveExits(effects, genotype, state) {
    // SUB-CONTROLLER: which exits from arrest are open
    state.exits = { recombination:true, adaptation:true, favourRecombination:false };
    state.exitDrivers = [];
    effects.filter(function (e) { return e.kind === 'exit'; }).forEach(function (e) {
      if (e.open === false) { state.exits[e.target] = false; state.exitDrivers.push(e); }
      if (e.favour) { state.exits.favourRecombination = true; state.exitDrivers.push(e); }
    });
    // Recombination needs an eroding tract to act on, whatever the genotype.
    state.recombinationSubstrate = (state.tract === 'eroding');
  }

  function nameOf(effect) { return effect.allele; }
}

function lesionWord(lesion) {
  // MODEL: prose name for a lesion identity (TERMINAL)
  if (lesion === 'cst') { return 'CST-failed'; }
  if (lesion === 'ku') { return 'Ku-less'; }
  if (lesion === 'erosion') { return 'eroded'; }
  return 'capped';
}

function lesionPhrase(lesion) {
  // MODEL: lesion word with the right indefinite article (TERMINAL)
  const w = lesionWord(lesion);
  return ('aeiou'.indexOf(w[0].toLowerCase()) >= 0 ? 'an ' : 'a ') + w + ' end';
}

/* ==========================================================================
   SHARED: tree traversal (phase two)
   The walk reads state. It never recomputes biology.
   ========================================================================== */

function traverseTree(state) {
  const trace = { nodes:[], edges:{}, weights:{}, steps:[], out:[], usedAlleles:{} };

  walkFromTract(state, trace);
  markProliferationContainer(trace);
  collectUnusedAlleles(state, trace);

  return trace;

  // === SUB-CONTROLLERS ===

  function walkFromTract(state, trace) {
    // SUB-CONTROLLER: q1 through the terminal fates
    stepTract(state, trace);
    stepCap(state, trace);
  }

  function stepTract(state, trace) {
    const map = { full:{ edge:'t1', node:'sfull', link:'m1' },
                  short:{ edge:'t2', node:'sstable', link:'m2' },
                  eroding:{ edge:'t3', node:'serode', link:'m3' } };
    const pick = map[state.tract];
    pushStep(trace, 'q1', pick.edge, state.tractDrivers, describeTract(state));
    trace.nodes.push(pick.node);
    trace.edges[pick.link] = '';
  }

  function stepCap(state, trace) {
    if (state.lesion === 'none') {
      if (state.tract === 'short') {
        pushStep(trace, 'q2', 'a2', [], 'Yes, on a short tract. There is no resection lesion, but the end is now a joining substrate.');
        stepDuplex(state, trace);
      } else {
        pushStep(trace, 'q2', 'a1', [], 'Yes. The overhang is held and the duplex tract is loaded, so nothing is presented to a nuclease or a sensor.');
        trace.weights.a1 = 'primary';
        finish(trace, 'subnorm');
      }
      return;
    }
    pushStep(trace, 'q2', 'a3', state.capDrivers, describeCap(state));
    stepNuclease(state, trace);
  }

  function stepNuclease(state, trace) {
    if (state.nucleases.length === 0) {
      if (state.tract === 'eroding') {
        pushStep(trace, 'q3', 'b2', state.nucleasesRemoved,
          'No, but the tract is eroding, so this is not a stable end.');
        trace.weights.b2 = 'primary';
        stepResolution(state, trace, false);
      } else {
        pushStep(trace, 'q3', 'b1', state.nucleasesRemoved, describeNucleaseLoss(state));
        trace.weights.b1 = 'primary';
        finish(trace, 'submaint');
      }
      return;
    }
    pushStep(trace, 'q3', 'b3', state.nucleasesRemoved, describeNucleaseActive(state));
    stepDepth(state, trace);
  }

  function stepDepth(state, trace) {
    if (state.depth === 'kilobase') {
      pushStep(trace, 'q4', 'c2', state.capDrivers,
        'Kilobase. CST is fully lost, so the reaction runs into subtelomeric X and unique sequence.');
      trace.nodes.push('tkb');
      trace.edges.d2 = '';
    } else {
      pushStep(trace, 'q4', 'c1', state.capDrivers,
        'Intermediate. CST still holds or partly holds the terminus, so the reaction stays inside the telomeric and subtelomeric tract.');
      trace.nodes.push('tint');
      trace.edges.d1 = '';
    }
    stepSsdna(state, trace);
  }

  function stepSsdna(state, trace) {
    if (!state.ssdnaSignals) {
      pushStep(trace, 'q5', 'e1', state.ssdnaDrivers, describeSsdna(state));
      stepDuplex(state, trace);
      return;
    }
    pushStep(trace, 'q5', 'e2', state.ssdnaDrivers, describeSsdna(state));
    stepCascade(state, trace);
  }

  function stepCascade(state, trace) {
    if (!state.cascade.intact) {
      pushStep(trace, 'q6', 'f1', missingAsDrivers(state.cascade),
        'No. ' + listMissing(state.cascade) + ' absent, so nothing pauses and the cell keeps cycling while the lesion sits there.');
      stepDuplex(state, trace);
      return;
    }
    pushStep(trace, 'q6', 'f2', [], 'Yes, so the cell arrests and the end keeps degrading while it waits.');
    stepAmplification(state, trace);
  }

  function stepAmplification(state, trace) {
    if (!state.amplified) {
      pushStep(trace, 'q7', 'g2', [],
        'No. CST is bound at this end, so Rad24 and 9-1-1 are not amplifying the lesion and the clamp question is skipped.');
      trace.nodes.push('arr');
      stepResolution(state, trace, true);
      return;
    }
    pushStep(trace, 'q7', 'g1', state.capDrivers,
      'Yes. Rad24 and 9-1-1 raise both resection and Mec1 output at a CST-failed end.');
    stepClamp(state, trace);
  }

  function stepClamp(state, trace) {
    if (!state.clampLoaded.intact) {
      pushStep(trace, 'q8', 'h1', missingAsDrivers(state.clampLoaded),
        'No. ' + listMissing(state.clampLoaded) + ' absent, so the clamp never loads and the amplified signal is not raised.');
      stepDuplex(state, trace);
      return;
    }
    pushStep(trace, 'q8', 'h2', [], 'Yes.');
    trace.nodes.push('arr');
    stepResolution(state, trace, true);
  }

  function stepResolution(state, trace, arrested) {
    if (arrested) { trace.edges.i1 = ''; }
    const open = openExits(state, arrested);
    pushStep(trace, 'qR', null, state.exitDrivers, describeResolution(state, open, arrested));
    trace.nodes.push('qR');
    assignOutcomes(open, trace);

    function openExits(state, arrested) {
      // MODEL: which of the three exits carry cells here (TERMINAL)
      const list = [];
      if (state.exits.recombination && state.recombinationSubstrate) { list.push('rB'); }
      if (arrested && state.exits.adaptation) { list.push('rA'); }
      list.push('rC');
      return list;
    }

    function assignOutcomes(open, trace) {
      // MODEL: rank the open exits and emit fates (TERMINAL)
      const spec = {
        rB:{ node:'subrec', label:'proliferating', tone:'live', setpoint:'recombination-maintained' },
        rA:{ node:'gl', label:'death by gene loss', tone:'death', setpoint:'' },
        rC:{ node:'arrdeath', label:'death in arrest', tone:'death', setpoint:'' }
      };
      let order = open.slice();
      if (open.indexOf('rB') >= 0 && state.exits.favourRecombination) {
        order = ['rB'].concat(open.filter(function (e) { return e !== 'rB'; }));
      } else if (open.indexOf('rA') >= 0) {
        order = ['rA'].concat(open.filter(function (e) { return e !== 'rA'; }));
      }
      const ranks = { rB:'rare survivors', rA:'cells that adapt', rC:'the remainder' };
      if (order.length === 1) { ranks[order[0]] = ''; }
      if (order[0] === 'rB') { ranks.rB = 'reported outcome'; }
      order.forEach(function (id, idx) {
        trace.edges[id] = (id === 'rC' && !state.exits.recombination) ? 'rad52' + D : '';
        trace.weights[id] = idx === 0 ? 'primary' : 'secondary';
        trace.nodes.push(spec[id].node);
        trace.out.push({ label:spec[id].label, tone:spec[id].tone, setpoint:spec[id].setpoint, rank:ranks[id] });
      });
    }
  }

  function stepDuplex(state, trace) {
    trace.nodes.push('qD');
    if (state.depth === 'kilobase') {
      pushStep(trace, 'qD', 'n1', [], 'No. Kilobase resection has removed it.');
      trace.weights.n1 = 'primary';
      finish(trace, 'gl');
      trace.out.push({ label:'death by gene loss', tone:'death', setpoint:'', rank:'' });
      return;
    }
    const reason = state.depth === 'none'
      ? 'Yes. Nothing was resected.'
      : 'Yes. Intermediate depth leaves template for C strand fill-in.';
    pushStep(trace, 'qD', 'n2', [], reason);
    stepRepression(state, trace);
  }

  function stepRepression(state, trace) {
    trace.nodes.push('qE');
    const tested = (state.tract !== 'full');
    if (tested && !state.repressors.intact) {
      state.contested.push(CONTESTED_NOTES.repressionShort);
      pushStep(trace, 'qE', 'p2', missingAsDrivers(state.repressors),
        'No. ' + listMissing(state.repressors) + ' absent over an already short array, so the second layer of repression is gone.');
      stepMachinery(state, trace);
      return;
    }
    if (state.lesion === 'none') {
      pushStep(trace, 'qE', 'p1', [], 'Yes, and the end is capped. Rap1 load carries repression at this setpoint.');
      trace.weights.p1 = 'primary';
      finish(trace, 'subshort');
      trace.out.push({ label:'proliferating', tone:'live', setpoint:'short setpoint', rank:'' });
      return;
    }
    const why = state.tract === 'full'
      ? 'Rap1 load is normal on a full-length tract.'
      : 'Mec1 and the 9-1-1 genes are intact.';
    pushStep(trace, 'qE', 'p3', [], 'Yes, and the end is uncapped. ' + why);
    trace.weights.p3 = 'primary';
    finish(trace, 'subunsig');
    trace.out.push({ label:'proliferating', tone:'live', setpoint:'unsignalled lesion', rank:'' });
  }

  function stepMachinery(state, trace) {
    trace.nodes.push('qF');
    if (!state.machinery.intact) {
      pushStep(trace, 'qF', 's1', missingAsDrivers(state.machinery),
        'No. ' + listMissing(state.machinery) + ' required at the joint and absent, so no fusion forms.');
      trace.weights.s1 = 'primary';
      finish(trace, 'subshort');
      trace.out.push({ label:'proliferating', tone:'live', setpoint:'short setpoint', rank:'' });
      return;
    }
    pushStep(trace, 'qF', 's2', [], 'Yes. Ku, Lig4 and Lif1 are all present.');
    trace.weights.s2 = 'primary';
    finish(trace, 'fus');
    trace.out.push({ label:'death by fusion', tone:'death', setpoint:'', rank:'' });
  }

  function finish(trace, fateNode) {
    trace.nodes.push(fateNode);
    if (fateNode === 'subnorm') {
      trace.out.push({ label:'proliferating', tone:'live', setpoint:'normal setpoint', rank:'' });
    }
    if (fateNode === 'submaint') {
      trace.out.push({ label:'proliferating', tone:'live', setpoint:'tract still maintained', rank:'' });
    }
  }

  function markProliferationContainer(trace) {
    // MODEL: light the proliferating box when any live fate is reached (TERMINAL)
    const live = ['subnorm','submaint','subrec','subshort','subunsig'];
    if (trace.nodes.some(function (n) { return live.indexOf(n) >= 0; })) { trace.nodes.push('prolif'); }
  }

  function collectUnusedAlleles(state, trace) {
    // MODEL: alleles carried but never consulted by this trace (TERMINAL)
    trace.unused = state.genotype.alleles.filter(function (a) { return !trace.usedAlleles[a]; });
  }

  function pushStep(trace, nodeId, edgeId, drivers, answer) {
    trace.nodes.push(nodeId);
    if (edgeId) {
      trace.edges[edgeId] = drivers.map(function (d) { return d.allele; }).filter(unique).join(', ');
    }
    (drivers || []).forEach(function (d) { if (d.allele) { trace.usedAlleles[d.allele] = true; } });
    trace.steps.push({ node:nodeId, edge:edgeId, answer:answer, drivers:drivers || [] });
  }

  function unique(v, i, arr) { return arr.indexOf(v) === i; }

  function missingAsDrivers(set) {
    // MODEL: turn missing requirement members into citable drivers (TERMINAL)
    return set.missing.map(function (m) {
      const effects = (ALLELES[m.allele] || { effects:[] }).effects;
      const match = effects.filter(function (e) {
        return e.target === m.name || (e.kind === 'machinery' && e.target === m.name);
      })[0];
      return { allele:m.allele, cite:(match && match.cite) || X, why:m.inferred ? 'placed on this list by inference' : null, contested:m.contested };
    }).filter(function (d, i, arr) {
      return arr.findIndex(function (o) { return o.allele === d.allele; }) === i;
    });
  }

  function listMissing(set) {
    const names = set.missing.map(function (m) { return m.name; }).filter(function (v, i, a) { return a.indexOf(v) === i; });
    return names.join(' and ') + (names.length > 1 ? ' are' : ' is');
  }
}

/* ==========================================================================
   SHARED: answer prose for the state-derived branches
   ========================================================================== */

function describeTract(state) {
  if (state.tract === 'full') {
    return 'Yes, at full length. Telomerase acts on the shortest ends and Ku and Rap1 set the ceiling.';
  }
  if (state.tract === 'short') {
    return 'Yes, at a lower setpoint. ' + reasonList(state.tractDrivers) + '.';
  }
  return 'No. ' + reasonList(state.tractDrivers) + '.';
}

function describeCap(state) {
  if (state.capDrivers.length) {
    const sev = state.cstSeverity === 'partial' && state.lesion === 'cst'
      ? ' A productive cap fails on some fraction of ends at this temperature.' : '';
    return 'No. ' + state.capDrivers.map(alleleEm).join(' and ') + ' fails here.' + sev;
  }
  return 'No. Cdc13 is present and binding, but Rap1 has come off the shortened array.';
}

function describeNucleaseActive(state) {
  const removed = state.nucleasesRemoved.map(function (e) { return e.target; });
  const base = 'Yes. ' + state.nucleases.join(' and ') + ' act' + (state.nucleases.length > 1 ? '' : 's') +
    ' at ' + lesionPhrase(state.lesion) + '.';
  if (!removed.length) { return base; }
  return base + ' ' + removed.join(' and ') + ' ' + (removed.length > 1 ? 'are' : 'is') + ' gone, and the remaining pathway still cuts.';
}

function describeNucleaseLoss(state) {
  const removed = state.nucleasesRemoved.map(function (e) { return e.target; });
  return 'No. ' + removed.join(' and ') + ' ' + (removed.length > 1 ? 'are' : 'is') +
    ' the only long-range pathway available at ' + lesionPhrase(state.lesion) +
    ', so nothing runs down and nothing chews in.';
}

function describeSsdna(state) {
  const verdict = state.ssdnaSignals ? 'Yes' : 'No';
  const rel = state.ssdnaSignals ? 'at or above' : 'below';
  return verdict + '. Level ' + state.ssdna + ' sits ' + rel + ' the signalling threshold of ' +
    RULES.ssdnaThreshold + '. ' + ssdnaBreakdown(state);
}

function ssdnaBreakdown(state) {
  // MODEL: show the ordinal arithmetic rather than assert the answer (TERMINAL)
  return state.ssdnaTerms.map(function (t, i) {
    if (i === 0) { return t.label + ' sets ' + t.value; }
    return t.label + ' ' + (t.value >= 0 ? 'adds ' + t.value : 'takes ' + (-t.value));
  }).join(', ') + '.';
}

function describeResolution(state, open, arrested) {
  const parts = [];
  if (open.indexOf('rB') >= 0) {
    parts.push('Recombination is available, since Rad52 is present and the tract is eroding' +
      (state.exits.favourRecombination ? ' and an inhibitor of recombination at ends has been removed' : ''));
  } else if (!state.exits.recombination) {
    parts.push('Recombination is closed, since Rad52 is absent');
  } else {
    parts.push('Recombination has nothing to act on, since the tract is not eroding');
  }
  if (open.indexOf('rA') >= 0) {
    parts.push('adaptation carries most cells into division with the end still uncapped');
  } else if (!arrested) {
    parts.push('adaptation is not available, since the cell never arrested');
  } else {
    parts.push('adaptation is closed');
  }
  parts.push('the remainder never divide again');
  return parts.map(function (t, i) {
    return i === 0 ? t : t.charAt(0).toUpperCase() + t.slice(1);
  }).join('. ') + '.';
}

function reasonList(drivers) {
  if (!drivers.length) { return 'maintenance is unperturbed'; }
  return drivers.map(function (d) {
    return alleleEm(d) + (d.why ? ': ' + d.why : '');
  }).join('. ');
}

function alleleEm(d) { return '<em>' + d.allele + '</em>'; }

/* ==========================================================================
   SHARED: scholarship lookup
   ========================================================================== */

function matchScholarship(genotype, temp) {
  // MODEL: exact allele-set match inside a temperature window (TERMINAL)
  const have = genotype.alleles.slice().sort().join('|');
  for (let i = 0; i < SCHOLARSHIP.length; i++) {
    const rec = SCHOLARSHIP[i];
    if (temp < rec.tMin || temp >= rec.tMax) { continue; }
    for (let j = 0; j < rec.sets.length; j++) {
      if (rec.sets[j].slice().sort().join('|') === have) { return rec; }
    }
  }
  return null;
}

/* ==========================================================================
   SHARED: SVG rendering
   ========================================================================== */

function svgTree(trace) {
  const nodeOn = new Set(trace.nodes);
  const edgeMap = trace.edges;
  const wMap = trace.weights || {};
  let s = '<svg viewBox="0 0 780 1700" role="img" class="traced">';
  s += '<title>Decision tree for chromosome end fate</title>';
  s += '<desc>Questions on tract maintenance, cap occupancy, resection nucleases, resection depth, checkpoint signalling, restoration after arrest, and the terminal joining reaction, ending in proliferation, gene loss or fusion.</desc>';
  s += '<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">';
  s += '<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>';

  NODES.filter(function (n) { return n.k === 'group'; }).forEach(function (c) {
    const lit = c.mem.some(function (m) { return nodeOn.has(m); });
    s += '<g class="node group' + (lit ? ' on' : '') + '">';
    s += '<rect class="n-box" x="' + c.x + '" y="' + c.y + '" width="' + c.w + '" height="' + c.h + '" rx="14"/>';
    s += '<text class="g-label" x="' + c.lxx + '" y="' + c.lyy + '" dominant-baseline="central">' + c.label + '</text></g>';
  });

  NODES.filter(function (n) { return n.k === 'container'; }).forEach(function (c) {
    s += '<g class="node container' + (c.frame ? ' frame' : '') + (nodeOn.has(c.id) ? ' on' : '') + '">';
    s += '<rect class="n-box" x="' + c.x + '" y="' + c.y + '" width="' + c.w + '" height="' + c.h + '" rx="16"/>';
    s += '<text class="n-title" x="' + c.lxx + '" y="' + c.lyy + '" dominant-baseline="central">' + c.label + '</text></g>';
  });

  EDGES.forEach(function (e) {
    const active = Object.prototype.hasOwnProperty.call(edgeMap, e.id);
    const w = active && wMap[e.id] ? ' w-' + wMap[e.id] : '';
    s += '<g class="edgegroup' + (active ? ' on' : '') + w + '">';
    s += '<path class="edge" d="' + e.d + '" marker-end="url(#ar)"/>';
    if (e.l) {
      s += '<text class="e-label" x="' + e.lx + '" y="' + e.ly + '" text-anchor="' + (e.la === 'start' ? 'start' : 'middle') + '" dominant-baseline="central">' + e.l + '</text>';
    }
    if (active && edgeMap[e.id]) {
      s += '<text class="e-allele" x="' + (e.ax !== undefined ? e.ax : e.lx) + '" y="' + (e.ay !== undefined ? e.ay : e.ly + 15) + '" text-anchor="' + (e.aa || 'middle') + '" dominant-baseline="central">' + edgeMap[e.id] + '</text>';
    }
    s += '</g>';
  });

  NODES.filter(function (n) { return n.k !== 'container' && n.k !== 'group'; }).forEach(function (n) {
    const cx = n.x + n.w / 2;
    const cy = n.h > 100 ? n.y + 44 : n.y;
    s += '<g class="node n-' + n.k + (nodeOn.has(n.id) ? ' on' : '') + '">';
    s += '<rect class="n-box" x="' + n.x + '" y="' + n.y + '" width="' + n.w + '" height="' + n.h + '" rx="7"/>';
    s += '<text class="n-title" x="' + cx + '" y="' + (cy + 22) + '" text-anchor="middle" dominant-baseline="central">' + n.t + '</text>';
    s += '<text class="n-sub" x="' + cx + '" y="' + (cy + 43) + '" text-anchor="middle" dominant-baseline="central">' + n.s + '</text>';
    s += '</g>';
  });
  return s + '</svg>';
}

function renderFigure(trace) {
  // VIEW: paint the traced tree (TERMINAL)
  document.getElementById('figure').innerHTML = svgTree(trace);
}

/* ==========================================================================
   SHARED: panel rendering
   ========================================================================== */

function renderPanel(genotype, state, trace, record) {
  const cut = measurementCut(record, trace);
  let html = composeTrace(trace, cut);
  html += composeVerdicts(trace, cut);
  html += composeEvidence(record);
  html += composeAudit(state, trace);
  document.getElementById('panel').innerHTML = html;

  function measurementCut(record, trace) {
    // MODEL: index of the last step the cited experiment reaches (TERMINAL)
    if (!record) { return 0; }
    const at = trace.steps.findIndex(function (st) { return st.node === record.through; });
    return at < 0 ? trace.steps.length : at + 1;
  }

  function composeTrace(trace, cut) {
    // VIEW: the question and answer ladder with per-branch citations (TERMINAL)
    let s = '<ol class="trace">';
    trace.steps.forEach(function (st, idx) {
      const node = NODES.filter(function (n) { return n.id === st.node; })[0];
      const cls = idx >= cut ? ' class="predicted"' : '';
      s += '<li' + cls + '><div class="q">' + (node ? node.t : st.node) + '</div>';
      s += '<div class="a">' + st.answer + '</div>';
      if (st.drivers && st.drivers.length) {
        st.drivers.forEach(function (d) {
          const missing = (!d.cite || d.cite === X);
          s += '<div class="drv"><i>' + d.allele + '</i> at this branch: ' +
            '<span class="src' + (missing ? ' none' : '') + '">' + (d.cite || X) + '</span>' +
            (d.contested ? ' (contested rule)' : '') + '</div>';
        });
      }
      s += '</li>';
      if (idx === cut - 1 && cut < trace.steps.length) {
        s += '<li class="mark">measurement stops here</li>';
      }
    });
    return s + '</ol>';
  }

  function composeVerdicts(trace, cut) {
    // VIEW: the fate cards (TERMINAL)
    const predicted = cut < trace.steps.length;
    let s = '';
    trace.out.forEach(function (o, idx) {
      s += '<div class="verdict ' + o.tone + (idx > 0 ? ' secondary' : '') + (predicted ? ' predicted' : '') + '">';
      if (o.rank) { s += '<div class="rank">' + o.rank + '</div>'; }
      s += '<div class="label">' + o.label + '</div>';
      if (o.setpoint) { s += '<div class="setpoint">' + o.setpoint + '</div>'; }
      if (predicted) { s += '<div class="basis">predicted, past the reported endpoint</div>'; }
      s += '</div>';
    });
    return s;
  }

  function composeEvidence(record) {
    // VIEW: whole-genotype scholarship, or nothing at all (TERMINAL)
    if (!record) {
      return '<div class="nodata">No published record matches this genotype at this temperature. ' +
        'Every step above rests on its own branch citation, and the fate is a prediction of the model.</div>';
    }
    let s = '<div class="box evidence"><h4>Reported for this genotype</h4>';
    s += '<div class="reported"><span>' + record.reported + '</span></div>';
    if (record.cite) {
      s += '<div class="cite' + (record.cite === X ? ' missing' : '') + '">Citation: <span>' + record.cite + '</span></div>';
    }
    if (record.caveat) { s += '<div class="caveat">' + record.caveat + '</div>'; }
    if (record.test) { s += '<div class="test"><b>Would falsify:</b> ' + record.test + '</div>'; }
    return s + '</div>';
  }

  function composeAudit(state, trace) {
    // VIEW: arbitration and unused alleles (TERMINAL)
    let s = '';
    const notes = state.contested.filter(function (v, i, a) { return a.indexOf(v) === i; });
    if (state.arbitration.length || notes.length) {
      s += '<div class="box contested"><h4>Where the model arbitrated</h4>';
      state.arbitration.forEach(function (a) {
        s += '<p><b>' + a.node + ':</b> ' + a.rule + '. ' + a.won + ' scored over ' + a.lost + '.</p>';
      });
      notes.forEach(function (n) { s += '<p>' + n + '</p>'; });
      s += '</div>';
    }
    if (trace.unused && trace.unused.length) {
      s += '<div class="box silent"><h4>Carried but never tested</h4><p>' +
        trace.unused.map(function (a) { return '<i>' + a + '</i>'; }).join(', ') +
        ' sit' + (trace.unused.length > 1 ? '' : 's') + ' in the genotype, but this trace never reaches a branch that reads ' +
        (trace.unused.length > 1 ? 'them' : 'it') + '. Any phenotype attributed to ' +
        (trace.unused.length > 1 ? 'these alleles' : 'this allele') + ' here is outside the model.</p></div>';
    }
    return s;
  }
}

/* ==========================================================================
   SHARED: header and temperature readout
   ========================================================================== */

function renderHeader(genotype, state, trace) {
  // VIEW: genotype signature and step count (TERMINAL)
  const name = genotype.alleles.length ? genotype.alleles.join(' ') : 'wild type';
  document.getElementById('sig').innerHTML = name;
  document.getElementById('count').textContent =
    trace.steps.length + ' question' + (trace.steps.length === 1 ? '' : 's') + ' asked, ' +
    trace.out.length + ' fate' + (trace.out.length === 1 ? '' : 's');
}

function refreshTemperatureReadout(genotype, state) {
  // VIEW: temperature value plus which alleles are conditional here (TERMINAL)
  const val = document.getElementById('tempval');
  const box = document.getElementById('tempbox');
  const reg = document.getElementById('regimes');
  if (!val) { return; }
  val.textContent = TEMP + ' °C';

  const conditional = genotype.alleles.filter(function (a) {
    const entry = ALLELES[a];
    if (!entry) { return false; }
    return entry.effects.some(function (e) { return e.tMin !== undefined || e.tMax !== undefined; });
  });

  if (!conditional.length) {
    box.classList.add('inert');
    reg.innerHTML = 'No selected allele is conditional. Temperature does not change this prediction.';
    return;
  }
  box.classList.remove('inert');
  reg.innerHTML = conditional.map(function (a) {
    const live = ALLELES[a].effects.filter(function (e) {
      const lo = (e.tMin === undefined) ? -99 : e.tMin;
      const hi = (e.tMax === undefined) ? 99 : e.tMax;
      return TEMP >= lo && TEMP < hi && (e.tMin !== undefined || e.tMax !== undefined);
    });
    const words = live.map(function (e) {
      if (e.kind === 'silent') { return 'permissive'; }
      if (e.kind === 'cap') { return e.severity === 'full' ? 'cap fully lost' : 'cap partly lost'; }
      if (e.kind === 'ssdna') { return 'ssDNA raised'; }
      return e.kind;
    });
    return '<b>' + a + '</b>: ' + (words.length ? words.join(', ') : 'no conditional effect here');
  }).join('<br>');
}

buildInterface();
</script>
